<!DOCTYPE html>
<html lang="es" class="p-dark">
<head>
    <title>DDownloader</title>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
    <link rel="stylesheet" href="https://unpkg.com/primereact/resources/themes/lara-dark-indigo/theme.css" id="theme-link">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <script src="/static/js/utils.js" defer></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<main style="padding: 4rem; margin: 0 auto;">
    <div class="surface-card p-6 shadow-8">
        <div class="flex justify-content-between align-items-center mb-6">
            <h1 class="m-0 flex align-items-center"><i class="pi pi-cloud-download mr-3" style="font-size: 1em;"></i>DDownloader</h1>
            <div class="flex align-items-center gap-3">
                <div class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input type="text" 
                           class="p-inputtext p-component" 
                           placeholder="Search..."
                           name="search"
                           hx-get="/files" 
                           hx-trigger="keyup changed delay:500ms" 
                           hx-target="#files-container">
                </div>
            </div>
        </div>

        <hr class="group-divider">

            <div id="files-container" hx-get="/files" hx-trigger="load">
                <div class="flex justify-content-center p-5">
                    <i class="pi pi-spin pi-spinner text-muted" style="font-size: 2rem"></i>
                </div>
            </div>

        <hr class="group-divider">
    </div>
</main>

    <footer class="mt-auto pb-4">
        <div class="flex flex-column align-items-center justify-content-center text-muted border-top-1 border-color-200 pt-4">
            <div class="flex align-items-center gap-2 mb-2">
                <i class="pi pi-cloud-download text-xl"></i>
                <span class="font-bold">DDownloader</span>
            </div>
            <div class="flex gap-4 text-sm opacity-70">
                <a href="https://github.com/moixblau/ddownloader" target="_blank" class="no-underline color-inherit hover:text-primary">
                    2026 <i class="pi pi-github"></i> GitHub
                </a>
            </div>
        </div>
    </footer>
    <div id="toast-container" class="toast-container"></div>
</body>
</html>
