<!DOCTYPE html>
<html lang="es" {{ if eq .Theme "dark" }}class="p-dark" style="color-scheme: dark"{{ else }}style="color-scheme: light"{{ end }}>
<head>
    <title>DDownloader - Login</title>
    <meta charset="UTF-8">
    {{ if eq .Theme "light" }}
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/lara-light.css">
    {{ else }}
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/lara-dark.css">
    {{ end }}
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .error-message {
            color: #f87171;
            padding: 1rem;
            background-color: rgba(248, 113, 113, 0.1);
            border-left: 4px solid #f87171;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="surface-card p-6 shadow-8">
            <div class="text-center mb-6">
                <i class="pi pi-cloud-download text-5xl text-primary mb-3"></i>
                <h1 class="m-0 mt-3">DDownloader</h1>
            </div>

            {{ if .Error }}
            <div class="error-message">
                <i class="pi pi-exclamation-circle mr-2"></i>
                {{ .Error }}
            </div>
            {{ end }}

            <form method="POST" class="flex flex-column gap-4">
                <div class="field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="p-inputtext w-full"
                        placeholder="password"
                        autofocus
                        required>
                </div>

                <button type="submit" class="p-button p-button-primary w-full">
                    <i class="pi pi-sign-in mr-2"></i>
                    Access
                </button>
            </form>
        </div>
    </div>
</body>
</html>
